[workspace]
resolver = "2"
members = ["crates/lodestone", "crates/lodestone-server", "crates/mc-rcon"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bollard = "0.18"
axum = { version = "0.8", features = ["macros", "multipart"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sysinfo = "0.33"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
uuid = { version = "1", features = ["v7"] }
zstd = "0.13"
fastnbt = "2"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
base64 = "0.22"
jsonwebtoken = { version = "9", default-features = false }
http-body-util = "0.1"
wiremock = "0.6"
mc-rcon = { path = "crates/mc-rcon" }
lodestone = { path = "crates/lodestone" }
